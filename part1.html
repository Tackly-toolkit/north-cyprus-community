<title>North Cyprus Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6ef;--card:#fff;--fg:#1e2b22;--mut:#5c6a60;--line:#dfe8db;--g:#86ab8f;--gd:#46704f;--gs:#e4efe5;--r:#d64a44;--rs:#fbe8e5;--onb:#fff;--shd:0 1px 2px rgba(35,65,45,.06),0 8px 22px rgba(35,65,45,.08);--hf:'Bricolage Grotesque','Onest',system-ui,sans-serif;--bf:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b241e;--fg:#e7eee8;--mut:#9aaca0;--line:#2a372e;--g:#7ea88a;--gd:#8fc29c;--gs:#223229;--r:#ee6b64;--rs:#38221f;--onb:#0f1a13;--shd:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b241e;--fg:#e7eee8;--mut:#9aaca0;--line:#2a372e;--g:#7ea88a;--gd:#8fc29c;--gs:#223229;--r:#ee6b64;--rs:#38221f;--onb:#0f1a13;--shd:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);color-scheme:dark}
*{box-sizing:border-box}
.sm a,.xs a{color:var(--gd);font-weight:600}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 15px/1.5 var(--bf);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}.ic.l{width:26px;height:26px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#hdr .wrap{display:flex;align-items:center;gap:2px;height:58px}
.logo{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font:700 14.5px var(--hf);border:0;background:none;padding:0;text-align:left}
.logo span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:50% 10% 50% 10%;background:var(--gs);color:var(--gd);display:grid;place-items:center;flex:none}
.ib{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--gs)}
.ib .dot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--r);color:#fff;font:600 10px/17px var(--bf);text-align:center;padding:0 4px}
.sosb{height:36px;padding:0 12px;border-radius:18px;border:2px solid var(--r);background:transparent;color:var(--r);font:700 13px var(--bf);display:flex;align-items:center;gap:5px;margin-left:2px}
main{min-height:70vh;padding-block:16px 120px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 8px}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--mut);font:500 11px var(--bf);min-width:0}
.nb.on{color:var(--gd)}.nb.on .ic{stroke-width:2.4}
.nb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.createb{justify-self:center;width:54px;height:46px;border:2.5px solid var(--r);background:transparent;color:var(--r);border-radius:50% 12% 50% 12%;display:grid;place-items:center;transition:transform .15s}
.createb:hover{transform:rotate(-6deg) scale(1.05)}.createb .ic{width:24px;height:24px;stroke-width:2.6}
.cap{font:500 11px var(--bf);color:var(--mut);text-align:center}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shd);padding:16px}
.stack>*+*{margin-top:14px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.h1{font-size:26px;font-weight:700}.h2{font-size:19px;font-weight:700}.h3{font-size:16px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}.row>.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;border:0;background:var(--gd);color:var(--onb);font:600 15px var(--bf);text-align:center}
.btn.soft{background:var(--gs);color:var(--gd)}
.btn.out{background:transparent;border:2px solid var(--r);color:var(--r)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.55}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);box-shadow:var(--shd);padding:8px 14px;border-radius:999px;font:500 14px var(--bf)}
.chip.on{background:var(--gd);color:var(--onb)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--gs);color:var(--gd);font:600 12px var(--bf)}
.pill.red{background:var(--rs);color:var(--r)}
.ring{--s:44px;width:var(--s);height:var(--s);border-radius:50%;padding:3px;flex:none;background:conic-gradient(from 210deg,var(--gd),#3aa6b9,var(--g),var(--gd));position:relative;display:inline-block}
.ring::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.5),transparent 45%);pointer-events:none}
.ring.bz{border-radius:32%}
.ring.bz::before{content:"";position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;border-radius:50%;background:var(--r);border:2px solid var(--card);z-index:2}
.av{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:2.5px solid var(--card);background:color-mix(in srgb,hsl(var(--h) 45% 55%) 32%,var(--card));font:700 15px var(--hf);overflow:hidden}
.ring.bz .av{border-radius:28%}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pfx{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lf{width:56px;height:56px;border-radius:50% 12% 50% 12%;display:grid;place-items:center;font:700 20px var(--hf);background:color-mix(in srgb,hsl(var(--h) 45% 55%) 30%,var(--card));color:var(--fg)}
.lf.sq{width:46px;height:46px;font-size:0}
.leaves{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.leaves::-webkit-scrollbar{display:none}
.leaf{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;width:68px;font:500 12px var(--bf)}
.leaf .lf{box-shadow:var(--shd)}
.leaf span.n{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaf.inv .lf{background:transparent;border:2px dashed var(--g);color:var(--gd);box-shadow:none}
.post .ph{display:flex;gap:12px;align-items:center}
.post .ph b{display:block;font-size:15px}
.post .ph small{color:var(--mut);display:flex;gap:4px;align-items:center;font-size:12px}
.post .txt{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .img{margin-top:12px;aspect-ratio:16/10;border-radius:16px;background:linear-gradient(135deg,var(--gs),color-mix(in srgb,var(--g) 40%,var(--card)));display:grid;place-items:center;color:var(--gd)}
.post .img .ic{width:44px;height:44px;opacity:.7}
.acts{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px;border-top:1px solid var(--line);padding-top:6px;gap:2px}
.actb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;color:var(--mut);font:500 11px var(--bf);text-decoration:none;min-width:0}
.actb:hover{background:var(--gs);color:var(--gd)}
.actb.on{color:var(--r)}.actb.on .ic{fill:var(--r)}
.actb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmts{margin-top:8px;display:grid;gap:8px}
.cm{display:flex;gap:8px;font-size:14px}.cm b{font-weight:600}
.cm .bub{background:var(--bg);padding:8px 12px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.cform{display:flex;gap:8px;margin-top:4px}
input,textarea,select{width:100%;font:400 16px var(--bf);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{min-height:100px;resize:vertical}
label.f{display:block;font:600 13px var(--bf);margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{border:0;text-align:left;background:var(--card);box-shadow:var(--shd);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:128px}
.mod .lf{width:46px;height:46px;background:var(--gs);color:var(--gd)}
.mod b{font:700 16px var(--hf)}.mod small{color:var(--mut);font-size:12.5px}
.hero{background:linear-gradient(135deg,var(--gs),color-mix(in srgb,var(--g) 35%,var(--card)));border-radius:24px;padding:22px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50% 12% 50% 12%;border:3px solid color-mix(in srgb,var(--r) 70%,transparent);opacity:.35}
.hero h2{font-size:23px;max-width:80%}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shd);overflow:hidden;display:flex;flex-direction:column;text-align:left;border:0;padding:0;min-width:0}
.tile .pic{aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(135deg,var(--gs),color-mix(in srgb,var(--g) 38%,var(--card)));color:var(--gd);position:relative}
.tile .pic .ic{width:38px;height:38px;opacity:.75}
.tile .pr{position:absolute;left:8px;bottom:8px;background:var(--card);padding:3px 10px;border-radius:999px;font:700 13px var(--bf)}
.tile .tb{padding:10px 12px 12px;display:grid;gap:2px}
.tile .tb b{font:600 14px var(--bf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);box-shadow:var(--shd);border-radius:18px;padding:14px;min-width:0}
.listrow .grow{flex:1;min-width:0}
.listrow b{display:block;font-weight:600}
.listrow .ic.chev{color:var(--mut)}
#ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ovh{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.ovh .wrap{display:flex;align-items:center;gap:8px;height:56px}
.ovh h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovb{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px))}
#sh{position:fixed;inset:0;z-index:60}
#sh .bd{position:absolute;inset:0;background:rgba(15,25,18,.45)}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;font:600 13px var(--bf);color:var(--mut);display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
.seg button.on{background:var(--card);color:var(--gd);box-shadow:var(--shd)}
.tg{width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--gd)}.tg.on i{transform:translateX(20px)}
.prog{height:10px;border-radius:5px;background:var(--gs);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gd);border-radius:5px;transition:width .3s}
.map{position:relative;aspect-ratio:16/11;border-radius:20px;overflow:hidden;background:var(--gs);box-shadow:var(--shd)}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;color:var(--r)}
.pin .ic{width:30px;height:30px;fill:var(--card);stroke-width:2.2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.pin.on .ic{fill:var(--r);stroke:var(--r)}
.town{position:absolute;font:600 10.5px var(--bf);color:var(--gd);transform:translate(-50%,0);opacity:.85}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--rs);color:var(--fg);font-size:14px}
.note .ic{color:var(--r);margin-top:2px}
.note.g{background:var(--gs)}.note.g .ic{color:var(--gd)}
.sticky{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:5}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--bg);padding:12px;border-radius:14px}
.step .num{width:28px;height:28px;border-radius:50% 10% 50% 10%;background:var(--gs);color:var(--gd);display:grid;place-items:center;font:700 13px var(--hf);flex:none}
.step.done .num{background:var(--gd);color:var(--onb)}.step.done span.tx{text-decoration:line-through;color:var(--mut)}
.clipv{aspect-ratio:9/13;max-height:56vh;margin:0 auto;border-radius:24px;background:linear-gradient(160deg,hsl(var(--h) 40% 40%),hsl(var(--h) 45% 22%));display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.clipv .ic{width:64px;height:64px;opacity:.9}
.clipv .tt{position:absolute;left:14px;right:14px;bottom:16px;font:600 15px var(--bf)}
.thumb{aspect-ratio:9/12;background:linear-gradient(160deg,hsl(var(--h) 40% 42%),hsl(var(--h) 45% 24%));display:grid;place-items:center;color:#fff;position:relative}
.thumb .du{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:999px;font:600 11px var(--bf)}
.foot{margin-top:24px;text-align:center}
.foot .fx{border:0;background:var(--card);box-shadow:var(--shd);width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:var(--mut)}
.foot .fb{margin-top:12px;display:grid;gap:8px;text-align:left}
.foot a{color:var(--gd);font-weight:600;text-decoration:none}
.sc{border-radius:20px;padding:14px;background:var(--gs);display:flex;gap:12px;align-items:flex-start}
.sc .lf{background:var(--card);color:var(--gd);width:42px;height:42px;flex:none}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;width:100%}
.opt.on{border-color:var(--gd);background:var(--gs)}
.opt .lf{background:var(--gs);color:var(--gd);width:46px;height:46px}
.bignum{font:700 40px var(--hf);color:var(--gd)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font:500 14px var(--bf);z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.blur{filter:blur(5px);pointer-events:none;user-select:none}
.gate{position:relative}
.gate .gc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.gate .gc>div{background:var(--card);border-radius:20px;box-shadow:var(--shd);padding:18px;max-width:340px}
.ovb .wrap,.ovb.wrap{padding-inline:16px}
@media (min-width:720px){.grid3{grid-template-columns:repeat(3,1fr)!important}}
.art{width:100%;height:100%;display:block;object-fit:cover}
.art .s{stroke:var(--gd);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .f1{fill:var(--card)}.art .f2{fill:var(--g)}.art .f3{fill:var(--gd)}.art .f4{fill:var(--r)}.art .fs{fill:var(--gs)}
.art .f1.s,.art .f2.s,.art .fs.s{stroke:var(--gd)}
.tile .pic .art{position:absolute;inset:0}
.galw{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shd)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .sl{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:16/10}
.gc{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font:600 12px var(--bf);padding:3px 10px;border-radius:999px}
.th{width:60px;height:60px;border-radius:50% 12% 50% 12%;overflow:hidden;flex:none;display:block}
.mod .mp{display:block;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden}
video.art{background:var(--gs)}
.clipv video,.clipv img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clipv .ic{position:relative;z-index:1}.clipv .tt{z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.thumb img.art{position:absolute;inset:0}.thumb .ic,.thumb .du{z-index:1}
.th.btn0{border:0;padding:0;background:none;cursor:pointer}
</style>
